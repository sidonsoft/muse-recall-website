name: Pages (static deploy)
on:
  # Publishes on every push to main once Pages is enabled (Settings → Pages →
  # Source: GitHub Actions). Until then the deploy job fails harmlessly.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site now lives in sidonsoft/muse-recall (website/). This repo only
      # publishes a redirect to https://sidonsoft.github.io/muse-recall/.
      - uses: actions/upload-pages-artifact@v3
        with: { path: redirect }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
